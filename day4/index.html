11<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QuickNotes - Day 4</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <header class="header">
      <div class="header-content">
        <div>
          <h1 class="logo">QuickNotes</h1>
          <p class="tagline">Capture ideas before they disappear.</p>
        </div>
        <button id="theme-toggle" type="button" aria-label="Toggle dark/light theme">Dark mode</button>
      </div>
    </header>

    <main class="main-content">
      <div class="card">
        <div class="form-group">
          <label for="note-text" class="form-label">Note</label>
          <textarea
            id="note-text"
            rows="6"
            placeholder="Write your note here (max 200 characters recommended)..."
          ></textarea>
        </div>

        <div class="stats-bar">
          <p id="char-count">0 / 200 characters</p>
          <p id="word-count">0 words</p>
        </div>

        <div class="action-bar">
          <button id="clear-btn" type="button">Clear</button>
        </div>
      </div>
    </main>

    <footer class="footer">
      <p>&copy; 2026 QuickNotes. Built during Web Foundations Day 4.</p>
    </footer>
  </body>
</html>
